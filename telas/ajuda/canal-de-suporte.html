<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canal de Suporte — Protótipo WeDOTalent</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <style>
    /* Layout exclusivo do launcher. Componentes e cores vem do base.css/tokens. */
    .sup-launcher {
      position: fixed; left: calc(var(--sidebar-width) + var(--space-4)); bottom: 72px;
      width: 372px; z-index: var(--z-modal);
      background: var(--bg-primary); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-float);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sup-fechar { align-self: flex-end; margin: var(--space-3) var(--space-3) 0; }
    .sup-titulo { font-size: 21px; font-weight: 600; line-height: 1.25;
      padding: 0 var(--space-5) var(--space-5); }
    .sup-opcoes { padding: var(--space-4) var(--space-5);
      border-top: 1px solid var(--border-subtle); }
    .sup-corpo { padding: 0 var(--space-5) var(--space-5);
      display: flex; flex-direction: column; gap: var(--space-3); }
    .sup-fornecedor { border: 1px dashed var(--border-default); border-radius: var(--radius-md);
      background: var(--bg-secondary); padding: var(--space-3);
      display: flex; flex-direction: column; gap: var(--space-3); }
    .sup-fornecedor-tag { font-size: var(--text-xs); color: var(--text-tertiary);
      text-transform: uppercase; letter-spacing: .4px; }
    .sup-msg { display: flex; gap: var(--space-2); align-items: flex-end; }
    .sup-msg .avatar { flex: none; }
    .sup-balao { background: var(--bg-primary); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 8px 10px; font-size: 13px;
      line-height: 1.5; max-width: 232px; }
    .sup-balao.meu { background: var(--bg-inverse); color: var(--text-inverse);
      border-color: var(--bg-inverse); margin-left: auto; }
    .sup-identificado { display: inline-flex; align-items: center; gap: 6px;
      align-self: center; font-size: var(--text-xs); font-weight: 600;
      color: var(--text-secondary); background: var(--bg-tertiary);
      border-radius: var(--radius-full); padding: 4px 10px; }
    .sup-campo-row { display: flex; gap: var(--space-2); align-items: center; }
    .sup-campo-row .input { flex: 1; }
    .sup-nota { font-size: var(--text-xs); color: var(--text-tertiary); line-height: 1.5; }
    .sup-slot { border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
      padding: 8px 10px; font-size: 13px; display: flex; align-items: center;
      justify-content: space-between; gap: var(--space-2); }
    /* Replica da janela real do HubSpot (portal 50630886), medida em navegador.
       Preto do cabecalho e cor de marca de terceiro: excecao prevista no contrato. */
    .hs-janela { border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
      overflow: hidden; background: var(--bg-primary); }
    .hs-head { background: #000000; color: #FFFFFF; display: flex; align-items: center;
      gap: 10px; padding: 12px var(--space-3); }
    .hs-logo { width: 34px; height: 34px; flex: none; border-radius: 50%; background: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; color: #000000; letter-spacing: -.3px; }
    .hs-head-txt strong { display: block; font-size: 14px; line-height: 1.2; }
    .hs-head-txt span { font-size: 11.5px; opacity: .82; line-height: 1.3; display: block; }
    .hs-corpo { padding: var(--space-3); display: flex; flex-direction: column;
      gap: var(--space-2); background: var(--bg-secondary); }
    .hs-privacidade { font-size: 10.5px; color: var(--text-tertiary); line-height: 1.45; }
    .hs-saudacao { background: var(--bg-primary); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md); padding: 9px 11px; font-size: 13px; line-height: 1.5; }
    .hs-input { display: flex; align-items: center; gap: 8px; background: var(--bg-primary);
      border: 1px solid var(--border-default); border-radius: var(--radius-full);
      padding: 8px 12px; }
    .hs-input span { flex: 1; font-size: 13px; color: var(--text-tertiary); }
    .hs-input svg { color: var(--text-tertiary); }
    .sup-aviso { font-size: var(--text-xs); line-height: 1.5; color: var(--text-secondary);
      background: var(--wedo-orange-bg); border-radius: var(--radius-sm); padding: 8px 10px; }
    .hs-flutuante { position: fixed; left: var(--space-4); bottom: 72px; width: 300px;
      z-index: var(--z-modal); box-shadow: var(--shadow-float); border-radius: var(--radius-md);
      overflow: hidden; }
    .hs-bolha { position: fixed; left: var(--space-4); bottom: var(--space-4);
      width: 52px; height: 52px; border-radius: 50%; background: #000000; color: #FFFFFF;
      display: flex; align-items: center; justify-content: center; z-index: var(--z-modal);
      box-shadow: var(--shadow-float); border: none; }
    .sup-skel { height: 12px; border-radius: var(--radius-sm); background: var(--bg-tertiary); }
  </style>
</head>
<body>
  <div id="shell" data-nav="Ajuda"></div>

  <div id="tela">
    <div class="page-head">
      <h1>Canal de Suporte</h1>
      <div class="spacer"></div>
    </div>
    <div class="card card-pad">
      <p style="font-size:13.5px;line-height:1.6;color:var(--text-secondary);max-width:640px">
        O ponto de entrada fica na barra inferior do menu, no lugar do ícone de dicas.
        Ao acionar, o atendimento abre sobre a tela atual, sem navegar e sem perder
        trabalho em andamento. Use a barra de estados para percorrer as abas e os
        casos de contorno.
      </p>
    </div>
  </div>

  <script src="../../screens.js"></script>
  <script src="../../scripts/shell.js"></script>
  <script src="../../scripts/conversas.js"></script>
  <script src="../../scripts/mock.js"></script>
  <script src="../../scripts/proto.js"></script>
  <script src="../../scripts/lia.js"></script>
  <script>
    Lia.mount({ roteiro: [
      { de: "user", texto: "A triagem da vaga de Analista de Dados não disparou as perguntas. É comigo ou é problema de vocês?" },
      { de: "lia", texto: "Não encontrei erro na configuração da vaga, então não é com você. Isso é caso para o suporte: abri o canal aqui embaixo com o contexto desta vaga já preenchido.", digitando: 1500 },
    ]});

    const m = Mock.seed(41);
    const ico = {
      boia: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/><circle cx="12" cy="12" r="4"/></svg>',
      x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
      enviar: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>',
      check: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
      relogio: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
      chat: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
      ticket: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2"/><path d="M13 17v2"/><path d="M13 11v2"/></svg>',
      agenda: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>',
      camera: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>',
      clipe: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>',
      alerta: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>',
    };

    const ABAS = [
      { id: "chat", rotulo: "Chat", ico: "chat" },
      { id: "ticket", rotulo: "Ticket", ico: "ticket" },
      { id: "agenda", rotulo: "Agenda", ico: "agenda" },
    ];

    function launcher(abaAtiva, corpoHtml) {
      const opcoes = ABAS.map((a) =>
        `<button class="choice-tab${a.id === abaAtiva ? " active" : ""}" data-aba="${a.id}">${ico[a.ico]}${a.rotulo}</button>`
      ).join("");
      return `
        <aside class="sup-launcher" role="dialog" aria-label="Canal de suporte">
          <button class="icon-btn sup-fechar" aria-label="Fechar o suporte">${ico.x}</button>
          <h2 class="sup-titulo">Podemos ajudar?</h2>
          <div class="sup-opcoes"><div class="choice-tabs">${opcoes}</div></div>
          ${corpoHtml ? `<div class="sup-corpo">${corpoHtml}</div>` : ""}
        </aside>`;
    }

    const empresa = m.pick(Mock.EMPRESAS);
    const primeiroNome = "Paulo";
    const identificado = `<span class="sup-identificado">${ico.check} Identificado como Paulo Moraes · ${empresa}</span>`;

    function janelaHubSpot() {
      return `
        <div class="hs-janela">
          <div class="hs-head">
            <span class="hs-logo">weDO</span>
            <span class="hs-head-txt"><strong>WeDOTalent</strong><span>Normalmente respondemos em poucos minutos</span></span>
          </div>
          <div class="hs-corpo">
            <p class="hs-privacidade">Ao conversar, você concorda com o processamento dos seus dados conforme a Política de Privacidade.</p>
            <div class="hs-saudacao">Olá! Bem-vindo ao suporte WeDOTalent. Como podemos ajudar você hoje?</div>
            <div class="hs-input"><span>Pergunte-me</span>${ico.camera}${ico.clipe}${ico.enviar}</div>
          </div>
        </div>`;
    }

    function corpoChat() {
      return `
        ${identificado}
        ${janelaHubSpot()}
        <p class="sup-aviso">O miolo é a janela do HubSpot. Ela se dimensiona sozinha e não aceita o nosso CSS, então a emenda com o cartão nunca fica perfeita. A configuração de cor, logo e saudação é feita no portal, não aqui.</p>`;
    }

    function corpoCarregando() {
      return `
        ${identificado}
        <div class="sup-fornecedor" aria-busy="true">
          <span class="sup-fornecedor-tag">Janela do HubSpot</span>
          <div class="sup-skel" style="width:70%"></div>
          <div class="sup-skel" style="width:90%"></div>
          <div class="sup-skel" style="width:55%"></div>
          <div class="sup-skel" style="width:80%"></div>
        </div>
        <p class="sup-nota">Primeira abertura: a janela do atendimento sobe sob demanda, e não junto com a plataforma.</p>`;
    }

    function corpoTicket() {
      return `
        ${identificado}
        <div class="field">
          <label for="sup-assunto">Assunto</label>
          <select id="sup-assunto" class="input">
            <option>Problema na plataforma</option>
            <option>Dúvida de uso</option>
            <option>Sugestão</option>
            <option>Cobrança</option>
          </select>
        </div>
        <div class="field">
          <label for="sup-desc">O que aconteceu</label>
          <textarea id="sup-desc" class="input" rows="3" placeholder="Descreva o que você esperava e o que aconteceu"></textarea>
        </div>
        <button class="btn btn-primary">Abrir chamado</button>
        <p class="sup-nota">O assunto define o tipo de problema e a prioridade, que é o que faz o prazo de resposta valer.</p>`;
    }

    function corpoAgenda() {
      return `
        ${identificado}
        <div class="sup-fornecedor">
          <span class="sup-fornecedor-tag">Agenda do HubSpot</span>
          <div class="sup-slot"><span>Quarta, 1 de outubro · 14h00</span><button class="btn btn-secondary btn-sm">Marcar</button></div>
          <div class="sup-slot"><span>Quarta, 1 de outubro · 16h30</span><button class="btn btn-secondary btn-sm">Marcar</button></div>
          <div class="sup-slot"><span>Quinta, 2 de outubro · 09h00</span><button class="btn btn-secondary btn-sm">Marcar</button></div>
        </div>
        <p class="sup-nota">Para quando o problema não cabe em texto. Os horários vêm da agenda de quem atende.</p>`;
    }

    function corpoForaDoHorario() {
      return `
        <div class="error-banner" style="align-items:flex-start">
          ${ico.relogio}
          <div>
            <strong style="display:block;font-size:13px">Fora do horário de atendimento</strong>
            <span style="font-size:12.5px">Atendemos de segunda a sexta, das 9h às 18h. Deixe sua mensagem que respondemos no próximo dia útil.</span>
          </div>
        </div>
        ${corpoChat()}`;
    }

    function corpoIndisponivel() {
      return `
        <div class="empty-state" style="padding:var(--space-6) var(--space-2)">
          <div style="color:var(--text-tertiary);margin-bottom:var(--space-2)">${ico.alerta}</div>
          <h3 style="font-size:14px">Não conseguimos abrir o atendimento</h3>
          <p style="font-size:12.5px;margin-bottom:var(--space-4)">Tente de novo em instantes. Se continuar, escreva para suporte@wedotalent.cc.</p>
          <button class="btn btn-secondary btn-sm">Tentar de novo</button>
        </div>`;
    }

    function pintaFlutuante() {
      document.querySelectorAll(".sup-launcher, .hs-flutuante, .hs-bolha").forEach((n) => n.remove());
      document.body.insertAdjacentHTML("beforeend",
        `<div class="hs-flutuante">${janelaHubSpot()}</div>
         <button class="hs-bolha" aria-label="Abrir suporte">${ico.chat}</button>`);
    }

    function pinta(aba, corpo) {
      document.querySelectorAll(".sup-launcher, .hs-flutuante, .hs-bolha").forEach((n) => n.remove());
      document.body.insertAdjacentHTML("beforeend", launcher(aba, corpo));
      document.querySelectorAll(".sup-launcher [data-aba]").forEach((b) => {
        b.addEventListener("click", () => Proto.apply(b.dataset.aba));
      });
    }

    Proto.states([
      { id: "padrao", label: "Escolha", render: () => pinta("chat", "") },
      { id: "chat", label: "Chat embutido", render: () => pinta("chat", corpoChat()) },
      { id: "chat-flutuante", label: "Chat flutuante (do HubSpot)", render: pintaFlutuante },
      { id: "carregando", label: "Abrindo pela 1ª vez", render: () => pinta("chat", corpoCarregando()) },
      { id: "ticket", label: "Ticket", render: () => pinta("ticket", corpoTicket()) },
      { id: "agenda", label: "Agenda", render: () => pinta("agenda", corpoAgenda()) },
      { id: "fora-do-horario", label: "Fora do horário", render: () => pinta("chat", corpoForaDoHorario()) },
      { id: "indisponivel", label: "Atendimento fora do ar", render: () => pinta("chat", corpoIndisponivel()) },
    ]);
  </script>
</body>
</html>
