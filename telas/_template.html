<!DOCTYPE html>
<!-- =========================================================
  TEMPLATE DE TELA — copie este arquivo para telas/<area>/<nome>.html
  Passos (detalhe no CLAUDE.md):
    1. Copiar para a pasta da área, em kebab-case.
    2. Trocar <title>, data-titulo e data-screen-id.
    3. Montar o conteúdo dentro de <div id="tela"> usando os
       componentes do base.css (nunca CSS com cor hex local).
    4. Registrar TODOS os estados obrigatórios em Proto.states().

========================================================= -->

    Lia.mount({ roteiro: [

      { de: "lia", texto: "Resposta da LIA com ação contextual.", digitando: 1400 },
    ]});
    const m = Mock.seed(1); // seed fixa por tela — dados estáveis

    function renderPadrao() { /* ... */ }

    Proto.states([
      { id: "padrao", label: "Padrão", render: renderPadrao },
      { id: "vazio", label: "0 registros", render: renderVazio },
      // ...demais estados obrigatórios do padrão da tela (docs/PATTERNS.md)
    ]);
