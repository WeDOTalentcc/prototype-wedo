<!DOCTYPE html>
<!-- =========================================================
  Conversar — chat da LIA em página cheia (pixel-faithful)
  Fontes: UnifiedChatEmptyState.tsx (círculo + saudação + rail),
  chat-workflow-reels.tsx + canonical-funnel-stages.ts (rail com
  9 nós, cores e 22 cards), UnifiedChatInput.tsx (caixa de input),
  UnifiedMessageList.tsx (bolha do usuário escura, LIA sem bolha),
  copy exata de messages/pt-BR.json (chat.workflowReels.*).
  O rail é interativo: clicar num nó abre os cards; clicar num card
  envia o comando e inicia a conversa simulada.
========================================================= -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversar — Protótipo WeDOTalent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <style>
    body { font-family: Inter, var(--font-sans); }
    .main .content { max-width: none; padding: 0; display: flex; flex-direction: column;
      height: 100vh; }
    #tela { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .chat-col { flex: 1; display: flex; flex-direction: column; max-width: 860px; width: 100%;
      margin: 0 auto; padding: 0 var(--space-6); min-height: 0; }

    /* ---------- Topo: breadcrumb + cabeçalho da conversa ---------- */
    .chat-top { padding: 14px 24px 0; }
    .crumbs { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--text-primary); }
    .crumbs svg { width: 15px; height: 15px; color: var(--text-secondary); }
    .crumbs .sep { color: var(--text-tertiary); }
    .crumbs a { color: var(--text-secondary); }
    .crumbs a:hover { color: var(--text-primary); }
    .crumbs b { font-weight: 600; }
    .conv-head { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .conv-head .brain { display: flex; color: var(--wedo-cyan); }
    .conv-head .brain svg { width: 18px; height: 18px; }
    .conv-head .nm { font-size: 14px; font-weight: 500; }
    .conv-head .chev { display: flex; color: var(--text-secondary); cursor: pointer; }
    .conv-head .chev svg { width: 14px; height: 14px; }
    .conv-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--wedo-green-bright); margin-left: 2px; }
    .conv-head .spacer { flex: 1; }
    .conv-actions { display: flex; align-items: center; gap: 2px; }
    .conv-actions button { padding: 6px; border: none; background: none; border-radius: 8px;
      color: var(--text-secondary); cursor: pointer; display: flex; }
    .conv-actions button:hover { background: var(--interactive-hover); color: var(--text-primary); }
    .conv-actions svg { width: 16px; height: 16px; }

    /* ---------- Empty state (UnifiedChatEmptyState) ---------- */
    .empty { flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 24px; padding: 48px 24px; }
    .empty .halo { width: 80px; height: 80px; border-radius: 50%; border: 1px solid var(--border-subtle);
      background: var(--bg-primary); display: flex; align-items: center; justify-content: center; }
    .empty .halo svg { width: 40px; height: 40px; color: var(--wedo-cyan); }
    .empty h2 { font-size: 24px; font-weight: 700; text-align: center; letter-spacing: -0.2px; }

    /* ---------- Rail de workflow (chat-workflow-reels) ---------- */
    .rail-wrap { width: 100%; max-width: 780px; }
    .rail { display: flex; align-items: flex-end; justify-content: center; padding: 8px 4px;
      overflow-x: auto; scrollbar-width: none; }
    .rail::-webkit-scrollbar { display: none; }
    .rail-node { display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 0 6px; background: none; border: none; cursor: pointer; transform-origin: bottom;
      transition: transform .15s cubic-bezier(.25, .46, .45, .94); font-family: inherit; }
    .rail-node:hover { transform: scale(1.12); }
    .rail-node .nd { width: 40px; height: 40px; border-radius: 50%; border: 2px solid;
      display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .rail-node .nd svg { width: 16px; height: 16px; }
    .rail-node span { font-size: 11px; font-weight: 500; white-space: nowrap; color: var(--text-primary); }
    .rail-node.active span { font-weight: 600; }
    .rail-link { height: 1px; width: 16px; background: var(--border-default); align-self: center; flex: none; }
    .rail-sep { width: 1px; height: 32px; margin: 0 8px; background: var(--border-subtle); align-self: center; flex: none; }
    .rail-cards { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px;
      animation: fade-up .25s ease-out; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .rail-card { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 2px;
      text-align: left; padding: 12px; border-radius: 12px; background: var(--bg-primary);
      border: 1px solid; cursor: pointer; transition: transform .15s, background .15s; font-family: inherit; }
    .rail-card:hover { transform: translateY(-2px); }
    .rail-card b { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .rail-card small { font-size: 12px; color: var(--text-secondary); line-height: 1.45; }

    /* ---------- Mensagens (UnifiedMessageList) ---------- */
    .msgs { flex: 1; overflow-y: auto; padding: 24px 4px; display: flex;
      flex-direction: column; gap: 16px; min-height: 0; }
    .m-user { align-self: flex-end; max-width: 80%; padding: 10px 16px; border-radius: 8px;
      background: var(--bg-inverse); color: var(--text-inverse); font-size: 14px; line-height: 1.55; }
    .m-lia { align-self: flex-start; max-width: 90%; display: flex; gap: 12px; }
    .m-lia .av { width: 28px; height: 28px; border-radius: 50%; background: var(--wedo-cyan-bg);
      display: flex; align-items: center; justify-content: center; flex: none; margin-top: 2px; }
    .m-lia .av svg { width: 15px; height: 15px; color: var(--wedo-cyan-dark); }
    .m-lia .tx { font-size: 14px; line-height: 1.6; color: var(--text-primary); white-space: pre-wrap; }
    .typing-dots { display: inline-flex; gap: 4px; padding: 6px 0; }
    .typing-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-tertiary);
      animation: tblink 1.2s infinite; }
    .typing-dots i:nth-child(2) { animation-delay: .2s; }
    .typing-dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes tblink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }

    /* Card de ação na resposta (RRP block) */
    .rrp { margin-top: 10px; border: 1px solid var(--border-subtle); border-radius: 12px;
      background: var(--bg-primary); padding: 14px 16px; max-width: 440px; }
    .rrp .rrp-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .rrp .rrp-head svg { width: 15px; height: 15px; color: var(--wedo-cyan-dark); }
    .rrp .rrp-head b { font-size: 13.5px; }
    .rrp .rrp-row { display: flex; justify-content: space-between; font-size: 12.5px;
      padding: 3px 0; color: var(--text-secondary); }
    .rrp .rrp-row b { color: var(--text-primary); font-weight: 600; }
    .rrp .rrp-actions { display: flex; gap: 8px; margin-top: 10px; }
    .rrp .rrp-actions .b1 { padding: 5px 12px; font-size: 12px; border-radius: 8px; border: none;
      background: var(--bg-inverse); color: var(--text-inverse); font-weight: 600; cursor: pointer; font-family: inherit; }
    .rrp .rrp-actions .b2 { padding: 5px 12px; font-size: 12px; border-radius: 8px;
      border: 1px solid var(--border-default); background: none; color: var(--text-primary);
      font-weight: 600; cursor: pointer; font-family: inherit; }

    /* Ações da mensagem da LIA (messageActions) */
    .m-actions { display: flex; align-items: center; gap: 2px; margin-top: 8px; }
    .m-actions button { padding: 4px; border: none; background: none; border-radius: 6px;
      color: var(--text-disabled); cursor: pointer; display: flex; }
    .m-actions button:hover { background: var(--interactive-hover); color: var(--text-secondary); }
    .m-actions button.up-on { color: var(--wedo-green); }
    .m-actions svg { width: 14px; height: 14px; }

    /* Erro de envio */
    .m-fail { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .m-fail .m-user { opacity: .55; }
    .m-fail .retry { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--status-error); }
    .m-fail .retry button { border: 1px solid var(--status-error); color: var(--status-error);
      background: none; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit; }

    /* ---------- Input (UnifiedChatInput) ---------- */
    .input-zone { padding: 12px 4px 20px; }
    .input-box { border: 1px solid var(--border-subtle); border-radius: 8px; background: var(--bg-primary);
      transition: border-color .15s, box-shadow .15s; }
    .input-box:focus-within { border-color: var(--wedo-cyan); box-shadow: 0 0 0 1px rgb(96 190 209 / .3); }
    .input-box textarea { width: 100%; border: none; resize: none; padding: 12px 14px 4px;
      font-size: 14px; font-family: inherit; color: var(--text-primary); background: none;
      outline: none; min-height: 44px; max-height: 160px; }
    .input-foot { display: flex; align-items: center; justify-content: space-between; padding: 0 12px 10px; }
    .input-foot .grp { display: flex; align-items: center; gap: 4px; }
    .input-foot .tool { padding: 6px; border-radius: 8px; border: none; background: none;
      color: var(--text-disabled); cursor: pointer; display: flex; }
    .input-foot .tool:hover { color: var(--text-secondary); background: var(--interactive-hover); }

    .input-hint { text-align: center; font-size: 11px; color: var(--text-tertiary); margin-top: 8px; }
    .input-hint a { color: inherit; text-decoration: underline; }
    .plus-wrap { position: relative; }
    .plus-menu { position: absolute; left: 0; bottom: calc(100% + 4px); width: 224px; z-index: 50;
      background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: 8px;
      padding: 4px 0; box-shadow: var(--shadow-md); }
    .plus-menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border: none; background: none; font-size: 14px; color: var(--text-secondary); cursor: pointer;
      font-family: inherit; text-align: left; }
    .plus-menu button:hover { background: var(--bg-secondary); }
    .plus-menu svg { width: 16px; height: 16px; }
    .input-foot .send { padding: 7px; border-radius: 8px; border: none; background: var(--bg-tertiary);
      color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .input-foot .send:hover:not([disabled]) { background: var(--wedo-cyan-bg); color: var(--wedo-cyan-dark); }
    .input-foot .send[disabled] { color: var(--text-disabled); }
  </style>
</head>
<body>
  <div id="shell" data-nav="Conversar"></div>

  <div id="tela">
    <div class="chat-top">
      <div class="crumbs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <a href="../_em-construcao.html?titulo=Início">Início</a>
        <span class="sep">›</span><b>Conversar</b>

      <div class="conv-head">
        <span class="brain"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/></svg></span>

          <button title="Mais opções"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
        </div>
      </div>
    </div>
    <div class="chat-col">
      <div class="empty" id="empty" hidden>
        <div class="halo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/></svg></div>

        <div class="rail-wrap">
          <div class="rail" id="rail"></div>
          <div class="rail-cards" id="rail-cards" hidden></div>
        </div>
      </div>

      <div class="msgs" id="msgs" hidden></div>

      <div class="input-zone">
        <div class="input-box">
          <textarea id="cin" rows="1" placeholder="Faça qualquer coisa com a IA..." aria-label="Mensagem para a IA"></textarea>
          <div class="input-foot">
            <div class="grp">
              <div class="plus-wrap">
                <button class="tool" id="plusbtn" title="Adicionar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
                <div class="plus-menu" id="plusmenu" hidden>
                  <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>Anexar PDF, DOCX ou CSV</button>
                  <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>Mencionar vaga ou candidato</button>

              </div>
              <button class="tool" title="Sugestões de consulta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg></button>

    </div>
  </div>

      "hiring-predictions": ["Previsões", "Estimativas de prazo e conversão do funil", "Mostrar previsões de contratação"],
      "configure-automations": ["Configurar automações", "Regras automáticas de triagem e transição", "Configurar automações de recrutamento"],
      "wsi-screening": ["Triagem WSI", "Avaliação inteligente com metodologia WSI", "Iniciar triagem WSI para candidatos"],
      "ai-suggestions": ["Sugestões da IA", "Recomendações baseadas no histórico", "O que você sugere para minhas vagas?"],
      "ai-credits": ["Créditos IA", "Consulte saldo e consumo de créditos", "Verificar meus créditos de IA"],
      "hiring-policy": ["Política de contratação", "Ajuste regras e nível de automação", "Configurar política de contratação"],
      "email-templates": ["Templates de email", "Gerencie modelos de comunicação", "Gerenciar templates de email"],
    };
    const STAGES = [
      { id: "definir-vaga", short: "Vaga", icon: "briefcase", cor: C.cyan, cards: ["create-job", "job-template"] },
      { id: "sourcing", short: "Captação", icon: "search", cor: C.green, cards: ["search-candidates", "add-candidate", "talent-pool"] },
      { id: "triagem", short: "Triagem", icon: "userCheck", cor: C.green, cards: ["candidate-info", "update-status"] },
      { id: "entrevista", short: "Entrevista", icon: "calendar", cor: C.orange, cards: ["schedule-interview", "reschedule-interview"] },
      { id: "oferta", short: "Oferta", icon: "fileText", cor: C.purple, cards: ["send-offer", "compare-candidates"] },
      { id: "contratacao", short: "Contratação", icon: "trendingUp", cor: C.purple, cards: ["register-hire", "close-vacancy"] },
    ];
    const UTILITY = [
      { id: "analytics", short: "Análises", icon: "barChart", cor: C.amber, cards: ["job-report", "daily-briefing", "hiring-predictions"] },
      { id: "ia-automacoes", short: "IA", icon: "sparkles", cor: C.cyan, cards: ["configure-automations", "wsi-screening", "ai-suggestions"] },
      { id: "configuracoes", short: "Config", icon: "settings", cor: C.gray, cards: ["ai-credits", "hiring-policy", "email-templates"] },
    ];

    const mix = (cor, pct) => `color-mix(in srgb, ${cor} ${pct}%, transparent)`;
    let activeStage = null;

    function nodeHtml(s) {
      return `<button class="rail-node" data-stage="${s.id}" title="${s.short}">
        <span class="nd" style="background:${mix(s.cor, 10)};border-color:${s.cor}">
          <svg viewBox="0 0 24 24" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${STAGE_ICONS[s.icon]}</svg>
        </span><span>${s.short}</span></button>`;
    }

    function renderRail() {
      const rail = document.getElementById("rail");
      rail.innerHTML =
        STAGES.map((s, i) => nodeHtml(s) + (i < STAGES.length - 1 ? '<span class="rail-link"></span>' : "")).join("") +
        '<span class="rail-sep"></span>' +
        UTILITY.map((s, i) => nodeHtml(s) + (i < UTILITY.length - 1 ? '<span class="rail-link"></span>' : "")).join("");
      rail.querySelectorAll(".rail-node").forEach((btn) => {
        btn.addEventListener("click", () => toggleCards(btn.dataset.stage));
        btn.addEventListener("mouseenter", () => toggleCards(btn.dataset.stage, true));
      });
    }

    function toggleCards(id, hover) {
      const all = [...STAGES, ...UTILITY];
      const st = all.find((s) => s.id === id);
      const panel = document.getElementById("rail-cards");
      if (!st || (activeStage === id && !hover)) { activeStage = null; panel.hidden = true; return; }
      activeStage = id;
      panel.hidden = false;
      panel.innerHTML = st.cards.map((cid) => {
        const [t, d, cmd] = SUG[cid];
        return `<button class="rail-card" style="border-color:${mix(st.cor, 25)}"
          onmouseover="this.style.borderColor='${st.cor}';this.style.background='${mix(st.cor, 10)}'"
          onmouseout="this.style.borderColor='${mix(st.cor, 25)}';this.style.background='var(--bg-primary)'"
          data-cmd="${cmd}"><b>${t}</b><small>${d}</small></button>`;
      }).join("");
      panel.querySelectorAll(".rail-card").forEach((c) =>
        c.addEventListener("click", () => sendUser(c.dataset.cmd)));
    }

    /* ---------- Conversa ---------- */
    const BRAIN_AV = `<span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${STAGE_ICONS.brain}</svg></span>`;
    const msgs = document.getElementById("msgs");
    const empty = document.getElementById("empty");
    let timers = [];
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));
    function resetChat() { timers.forEach(clearTimeout); timers = []; msgs.innerHTML = ""; }
    function showChat() { empty.hidden = true; msgs.hidden = false; }
    function showEmpty() { empty.hidden = false; msgs.hidden = true; document.getElementById("rail-cards").hidden = true; activeStage = null; }
    function scrollEnd() { msgs.scrollTop = msgs.scrollHeight; }

    function addUser(t) { msgs.insertAdjacentHTML("beforeend", `<div class="m-user">${t}</div>`); scrollEnd(); }
    function addTyping() {
      msgs.insertAdjacentHTML("beforeend", `<div class="m-lia" id="ty">${BRAIN_AV}<div class="tx"><span class="typing-dots"><i></i><i></i><i></i></span></div></div>`);
      scrollEnd();
    }
    const ACTIONS_BAR = `<div class="m-actions">
      <button title="Copiar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
      <button title="Inserir no chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button title="Útil" onclick="this.classList.toggle('up-on')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg></button>
      <button title="Não útil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg></button>
      <button title="Gerar novamente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
    </div>`;

    function streamLia(texto, extraHtml, done) {
      document.getElementById("ty")?.remove();
      const id = "mm" + Math.floor(performance.now());
      msgs.insertAdjacentHTML("beforeend", `<div class="m-lia">${BRAIN_AV}<div><div class="tx" id="${id}"></div><div id="${id}x"></div></div></div>`);
      let i = 0;
      const iv = setInterval(() => {
        i += 3;
        document.getElementById(id).textContent = texto.slice(0, i);
        scrollEnd();
        if (i >= texto.length) {
          clearInterval(iv);
          document.getElementById(id + "x").innerHTML = (extraHtml || "") + ACTIONS_BAR;
          scrollEnd();
          if (done) done();
        }
      }, 16);
      timers.push(iv);
    }

    const CARD_VAGA = `<div class="rrp"><div class="rrp-head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${STAGE_ICONS.briefcase}</svg><b>Desenvolvedor(a) Backend Ruby</b> <span class="badge badge-gray">Rascunho</span></div>
      <div class="rrp-row"><span>Departamento</span><b>Tecnologia</b></div>
      <div class="rrp-row"><span>Senioridade</span><b>Pleno</b></div>
      <div class="rrp-row"><span>Faixa salarial</span><b>R$ 9.000 – R$ 12.500</b></div>
      <div class="rrp-row"><span>Triagem</span><b>7 perguntas (2 eliminatórias)</b></div>
      <div class="rrp-actions"><button class="b1">Revisar e publicar</button><button class="b2">Editar</button></div></div>`;

    function sendUser(texto) {
      showChat();
      addUser(texto);
      addTyping();
      later(() => streamLia(
        "Perfeito! Já comecei a trabalhar nisso. Montei a estrutura com base no catálogo da empresa e nas suas últimas vagas — dá uma olhada:",
        CARD_VAGA
      ), 1400);
      document.dispatchEvent(new CustomEvent("proto:conversa"));
    }

    /* ---------- Input ---------- */
    const cin = document.getElementById("cin");
    const csend = document.getElementById("csend");
    cin.addEventListener("input", () => {
      csend.disabled = !cin.value.trim();
      cin.style.height = "auto"; cin.style.height = Math.min(cin.scrollHeight, 160) + "px";
    });
    function submit() {
      const v = cin.value.trim();
      if (!v) return;
      cin.value = ""; csend.disabled = true; cin.style.height = "auto";
      sendUser(v);
    }
    csend.addEventListener("click", submit);
    cin.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });

    /* ---------- Estados ---------- */
    function stVazio() { resetChat(); showEmpty(); }
    function stConversa() {
      resetChat(); showChat();
      addUser("Criar uma nova vaga");
      streamLia("Claro! Para qual área é a vaga? Posso puxar os padrões do seu catálogo de benefícios e a faixa salarial por nível automaticamente.", null, () => {
        later(() => { addUser("Backend Ruby, time de Tecnologia, nível pleno"); addTyping();
          later(() => streamLia("Perfeito! Já comecei a trabalhar nisso. Montei a estrutura com base no catálogo da empresa e nas suas últimas vagas — dá uma olhada:", CARD_VAGA), 1600);
        }, 900);
      });
    }
    function stDigitando() { resetChat(); showChat(); addUser("Me dê o briefing de hoje"); addTyping(); }
    function stComCard() {
      resetChat(); showChat();
      addUser("Criar uma nova vaga de Backend Ruby");
      streamLia("Feito! A vaga está pronta em Rascunho:", CARD_VAGA);
    }
    function stErro() {
      resetChat(); showChat();
      addUser("Buscar candidatos para a vaga de QA");
      streamLia("Encontrei 12 candidatos compatíveis. Quer que eu monte a short list?", null, () => {
        later(() => {
          msgs.insertAdjacentHTML("beforeend", `<div class="m-fail"><div class="m-user">Sim, monta a short list</div>
            <div class="retry">⚠ Não foi possível enviar <button>Tentar de novo</button></div></div>`);
          scrollEnd();
        }, 800);
      });
    }

    const tParam = new URL(location.href).searchParams.get("titulo");
    if (tParam) document.querySelector(".conv-head .nm").textContent = tParam;
    const h = new Date().getHours();
    const per = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
    document.getElementById("saudacao").textContent = per + ", Paulo Moraes. Tudo em dia. Vamos adiantar algo?";

    const plusbtn = document.getElementById("plusbtn"), plusmenu = document.getElementById("plusmenu");
    plusbtn.addEventListener("click", (e) => { e.stopPropagation(); plusmenu.hidden = !plusmenu.hidden; });
    document.addEventListener("click", () => { plusmenu.hidden = true; });

    renderRail();
    Proto.states([
      { id: "vazio", label: "Vazio (sugestões)", render: stVazio },
      { id: "conversa", label: "Conversa", render: stConversa },
      { id: "digitando", label: "LIA digitando", render: stDigitando },
      { id: "com-card", label: "Resposta com card", render: stComCard },
      { id: "erro", label: "Erro de envio", render: stErro },
    ]);
  </script>

  <style>
    /* ---------- Interações (dropdowns, sugestões, toast) ---------- */
    .cv-menu { position: absolute; top: calc(100% + 4px); width: 176px; z-index: 60;
      background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: 8px;

    .cv-menu button.danger { color: var(--status-error); }
    .cv-menu svg { width: 14px; height: 14px; }

      border-radius: 6px; padding: 2px 8px; outline: none; width: 180px; }

    .sug-panel { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 55;
      background: var(--bg-primary); border: 1px solid var(--border-subtle); border-radius: 12px;
      box-shadow: var(--shadow-lg); overflow: hidden; }

      padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); }
    .sug-head span { font-size: 11px; font-weight: 600; color: var(--text-secondary);
      text-transform: uppercase; letter-spacing: .05em; }
    .sug-head button { border: none; background: none; padding: 2px; border-radius: 4px;
      color: var(--text-tertiary); cursor: pointer; display: flex; }
    .sug-head button:hover { background: var(--interactive-hover); color: var(--text-secondary); }
    .sug-search { padding: 8px 12px; border-bottom: 1px solid var(--border-subtle); }

      color: var(--text-tertiary); padding: 8px 10px 2px; display: flex; align-items: center; gap: 6px; }
    .sug-cat svg { width: 12px; height: 12px; }
    .input-zone { position: relative; }

    .attach-chip { display: inline-flex; align-items: center; gap: 8px; margin: 10px 12px 0;
      padding: 6px 10px; border-radius: 8px; background: var(--bg-secondary);
      border: 1px solid var(--border-subtle); font-size: 12.5px; color: var(--text-secondary); }
    .attach-chip svg { width: 14px; height: 14px; }
    .attach-chip button { border: none; background: none; color: var(--text-tertiary); cursor: pointer;
      display: flex; padding: 1px; border-radius: 4px; }
    .attach-chip button:hover { color: var(--text-secondary); background: var(--interactive-hover); }

    .tool.rec { color: var(--status-error); background: var(--status-error-bg); animation: recpulse 1.2s infinite; }
    @keyframes recpulse { 50% { opacity: .6; } }

    .fb-pop { position: absolute; z-index: 70; width: 280px; background: var(--bg-primary);
      border: 1px solid var(--border-subtle); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 10px; }
    .fb-pop .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .fb-pop .cats button { border: 1px solid var(--border-default); background: none; border-radius: 999px;
      padding: 3px 10px; font-size: 11.5px; color: var(--text-secondary); cursor: pointer; font-family: inherit; }
    .fb-pop .cats button.on { border-color: var(--wedo-cyan); color: var(--wedo-cyan-dark); background: var(--wedo-cyan-bg); }
    .fb-pop textarea { width: 100%; border: 1px solid var(--border-subtle); border-radius: 8px;
      font-size: 12px; padding: 6px 8px; min-height: 56px; font-family: inherit; resize: none; outline: none; }
    .fb-pop .row { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
    .fb-pop .row .c { border: none; background: none; font-size: 12px; color: var(--text-secondary);
      padding: 4px 8px; border-radius: 6px; cursor: pointer; font-family: inherit; }
    .fb-pop .row .s { border: none; background: var(--bg-inverse); color: var(--text-inverse); font-size: 12px;
      padding: 4px 10px; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 600; }

    .toast-box { position: fixed; bottom: 76px; right: 24px; z-index: 400; display: flex;
      flex-direction: column; gap: 8px; }
    .toast { background: var(--bg-inverse); color: var(--text-inverse); font-size: 13px;
      padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow-float);
      animation: toast-in .2s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
  <div class="toast-box" id="toasts"></div>
  <script>
    /* =============== Ações reais (replicadas do produto) =============== */
    const I14 = (p) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const P_PIN = '<path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>';
    const P_PEN = '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>';
    const P_NOTE = '<path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/>';
    const P_ARCH = '<rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>';
    const P_TRASH = '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>';
    const P_CLIP = '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>';
    const P_X = '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>';
    const P_ZAP = '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>';
    const P_BRIEF = '<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>';
    const P_USERS = '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>';

    function toast(msg) {
      const t = document.createElement("div");
      t.className = "toast"; t.textContent = msg;
      document.getElementById("toasts").appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    /* ---------- Dropdown da conversa (chevron do título e ⋯) ---------- */
    let pinned = false;
    function convMenu(anchorRight) {
      closeMenus();
      const head = document.querySelector(".conv-head");
      const m = document.createElement("div");
      m.className = "cv-menu";
      m.style[anchorRight ? "right" : "left"] = anchorRight ? "0" : "24px";
      m.innerHTML = `
        <button data-a="pin">${I14(P_PIN)}${pinned ? "Desafixar" : "Fixar"}</button>
        <button data-a="rename">${I14(P_PEN)}Renomear</button>
        <button data-a="note">${I14(P_NOTE)}Adicionar nota</button>
        <button data-a="arch">${I14(P_ARCH)}Arquivar</button>
        <button data-a="del" class="danger">${I14(P_TRASH)}Excluir</button>`;
      head.appendChild(m);
      m.addEventListener("click", (e) => {
        const a = e.target.closest("button")?.dataset.a;
        if (!a) return;
        closeMenus();
        if (a === "pin") { pinned = !pinned; toast(pinned ? "Conversa fixada" : "Conversa desafixada"); }
        if (a === "rename") startRename();
        if (a === "note") toast("Nota adicionada à conversa");
        if (a === "arch") { toast("Conversa arquivada"); Proto.apply("vazio"); }
        if (a === "del") { toast("Conversa excluída"); Proto.apply("vazio"); }
      });
      setTimeout(() => document.addEventListener("click", closeMenus, { once: true }));
    }
    function closeMenus() { document.querySelectorAll(".cv-menu, .fb-pop").forEach((x) => x.remove()); }
    function startRename() {
      const nm = document.querySelector(".conv-head .nm");
      const cur = nm.textContent;
      nm.innerHTML = `<input class="rename-input" value="${cur}">`;
      const inp = nm.querySelector("input");
      inp.focus(); inp.select();
      const finish = (save) => { nm.textContent = save && inp.value.trim() ? inp.value.trim() : cur; if (save) toast("Conversa renomeada"); };
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") finish(true); if (e.key === "Escape") finish(false); });
      inp.addEventListener("blur", () => finish(true));
    }
    document.querySelector(".conv-head .nm").addEventListener("click", (e) => { e.stopPropagation(); convMenu(false); });
    document.querySelector(".conv-head .chev").addEventListener("click", (e) => { e.stopPropagation(); convMenu(false); });
    document.querySelector('.conv-actions button[title="Mais opções"]').addEventListener("click", (e) => { e.stopPropagation(); convMenu(true); });

    /* ---------- Expandir (modo de exibição) ---------- */
    document.querySelector('.conv-actions button[title="Expandir"]').addEventListener("click", () => {
      document.body.classList.toggle("sb-collapsed");
      toast(document.body.classList.contains("sb-collapsed") ? "Modo tela cheia" : "Modo padrão");
    });

    /* ---------- 💡 Sugestões de consulta (insere no prompt) ---------- */
    const SUG_QUERIES = [
      "Quais vagas estão paradas há mais de 15 dias?",
      "Resuma o funil da vaga de Backend Ruby",
      "Quem são os 5 melhores candidatos de QA?",
      "Quantas entrevistas tenho esta semana?",
      "Compare os finalistas da vaga de Product Manager",
      "Quais candidatos aguardam retorno há mais de 3 dias?",
      "Gere o relatório semanal de recrutamento",
      "Qual o custo de IA deste mês?",
    ];
    const lightBtn = document.querySelector('.input-foot .grp .tool[title="Sugestões de consulta"]');
    lightBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const old = document.querySelector(".sug-panel");
      if (old) { old.remove(); return; }
      const p = document.createElement("div");
      p.className = "sug-panel";
      p.innerHTML = `
        <div class="sug-head"><span>Sugestões de consulta</span><button aria-label="Fechar sugestões">${I14(P_X)}</button></div>
        <div class="sug-search"><input placeholder="Buscar consulta..."></div>
        <div class="sug-list">${SUG_QUERIES.map((q) => `<button class="sug-item">${I14(P_ZAP)}${q}</button>`).join("")}</div>
        <div class="sug-hint">Clique para inserir no prompt</div>`;
      document.querySelector(".input-zone").appendChild(p);
      p.querySelector(".sug-head button").addEventListener("click", () => p.remove());
      p.querySelector(".sug-search input").addEventListener("input", (ev) => {
        const v = ev.target.value.toLowerCase();
        p.querySelectorAll(".sug-item").forEach((b) => { b.hidden = !b.textContent.toLowerCase().includes(v); });
      });
      p.querySelectorAll(".sug-item").forEach((b) => b.addEventListener("click", () => {
        cin.value = b.textContent.trim(); cin.dispatchEvent(new Event("input")); cin.focus(); p.remove();
      }));
    });

    /* ---------- Menu do + : anexar e mencionar ---------- */
    const plusItems = document.querySelectorAll("#plusmenu button");
    plusItems[0].addEventListener("click", () => { // Anexar
      document.getElementById("plusmenu").hidden = true;
      const box = document.querySelector(".input-box");
      if (box.querySelector(".attach-chip")) return;
      box.insertAdjacentHTML("afterbegin",
        `<span class="attach-chip">${I14(P_CLIP)}curriculo-ana-beatriz-souza.pdf
          <button aria-label="Remover arquivo" onclick="this.parentElement.remove()">${I14(P_X)}</button></span>`);
      toast("Arquivo anexado");
    });
    plusItems[1].addEventListener("click", (e) => { // Mencionar
      e.stopPropagation();
      document.getElementById("plusmenu").hidden = true;
      const p = document.createElement("div");
      p.className = "sug-panel";
      const vagas = ["Desenvolvedor(a) Backend Ruby", "QA Engineer", "Product Manager"];
      const cands = ["Ana Beatriz Souza", "Carlos Eduardo Lima", "Mariana Ferreira"];
      p.innerHTML = `
        <div class="sug-head"><span>Mencionar</span><button>${I14(P_X)}</button></div>
        <div class="sug-list">
          <div class="sug-cat">${I14(P_BRIEF)}Vagas</div>
          ${vagas.map((v) => `<button class="sug-item" data-m="${v}">${I14(P_BRIEF)}${v}</button>`).join("")}
          <div class="sug-cat">${I14(P_USERS)}Candidatos</div>
          ${cands.map((v) => `<button class="sug-item" data-m="${v}">${I14(P_USERS)}${v}</button>`).join("")}
        </div>`;
      document.querySelector(".input-zone").appendChild(p);
      p.querySelector(".sug-head button").addEventListener("click", () => p.remove());
      p.querySelectorAll(".sug-item").forEach((b) => b.addEventListener("click", () => {
        cin.value = (cin.value ? cin.value + " " : "") + "@" + b.dataset.m + " ";
        cin.dispatchEvent(new Event("input")); cin.focus(); p.remove();
      }));
    });

    /* ---------- Mic: gravação simulada + transcrição ---------- */
    const micBtn = document.querySelector('.input-foot .tool[title="Gravar áudio"]');
    micBtn.addEventListener("click", () => {
      if (micBtn.classList.contains("rec")) return;
      micBtn.classList.add("rec");
      setTimeout(() => {
        micBtn.classList.remove("rec");
        cin.value = (cin.value ? cin.value + " " : "") + "Buscar desenvolvedores Python disponíveis em São Paulo";
        cin.dispatchEvent(new Event("input")); cin.focus();
      }, 2200);
    });

    /* ---------- Ações da mensagem (delegação no #msgs) ---------- */
    msgs.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const title = btn.title;
      const mWrap = btn.closest(".m-lia");
      if (title === "Copiar") {
        const tx = mWrap?.querySelector(".tx")?.textContent || "";
        navigator.clipboard?.writeText(tx);
        toast("Resposta copiada");
      } else if (title === "Inserir no chat") {
        cin.value = mWrap?.querySelector(".tx")?.textContent || "";
        cin.dispatchEvent(new Event("input")); cin.focus();
      } else if (title === "Não útil") {
        closeMenus();
        const pop = document.createElement("div");
        pop.className = "fb-pop";
        pop.innerHTML = `
          <div class="cats">${["Incorreta", "Incompleta", "Fora do contexto", "Outro"].map((c) =>
            `<button onclick="this.classList.toggle('on')">${c}</button>`).join("")}</div>
          <textarea placeholder="Conte o que poderia melhorar (opcional)"></textarea>
          <div class="row"><button class="c">Cancelar</button><button class="s">Enviar</button></div>`;
        const r = btn.getBoundingClientRect();
        pop.style.left = Math.min(r.left, window.innerWidth - 300) + "px";
        pop.style.top = (r.bottom + 6) + "px";
        pop.style.position = "fixed";
        document.body.appendChild(pop);
        pop.querySelector(".c").addEventListener("click", () => pop.remove());
        pop.querySelector(".s").addEventListener("click", () => { pop.remove(); toast("Obrigado pelo feedback!"); });
      } else if (title === "Gerar novamente") {
        const tx = mWrap?.querySelector(".tx")?.textContent || "";
        mWrap.remove(); addTyping();
        later(() => streamLia(tx), 1000);
      } else if (btn.classList.contains("b1")) { // Revisar e publicar
        location.href = "../vagas/lista-de-vagas.html";
      } else if (btn.classList.contains("b2")) { // Editar
        addUser("Quero editar a vaga antes de publicar");
        addTyping();
        later(() => streamLia("Claro! O que você quer ajustar? Posso mudar requisitos, faixa salarial, benefícios ou as perguntas de triagem — é só me dizer."), 1200);
      }
    });
  </script>

</body>
</html>
