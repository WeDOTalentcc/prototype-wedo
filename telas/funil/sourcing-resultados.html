<!DOCTYPE html>
<!-- =========================================================
  Funil de Talentos > Sourcing (resultados da busca)
  Réplica da tela do produto (ai-ui: SearchResultsHeader +
  CandidatesTableArea) com as propostas de melhoria:
   1. taxonomia no lugar do texto corrido da busca
   2. uma porta só para editar a busca (painel lateral)
   3. salvar na vaga sem perder a busca
   5. continuar a mesma busca sem repetir quem já foi visto
========================================================= -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sourcing: resultados da busca — Protótipo WeDOTalent</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <style>
    /* layout específico desta tela */
    .controls-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
    .controls-row .spacer { flex: 1; }
    .res-count { font-size: var(--text-sm); color: var(--text-tertiary); }
    .tbl td.c-check, .tbl th.c-check { width: 44px; }
    .tbl td.c-match, .tbl th.c-match { width: 78px; }
    .tbl td.c-fonte, .tbl th.c-fonte { width: 68px; }
    .tbl td.c-cargo { color: var(--text-secondary); font-size: var(--text-sm); }
    .nome-cell { display: flex; align-items: center; gap: var(--space-2); }
    .skeleton-row { height: 44px; }
  </style>
</head>
<body>
  <div id="shell" data-nav="Funil de Talentos"></div>

  <div id="tela">
    <div class="crumbs" style="margin-bottom:var(--space-3)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <a href="../_em-construcao.html?titulo=Início">Início</a>
      <span class="sep">›</span><a href="../_em-construcao.html?titulo=Funil de Talentos">Funil de Talentos</a>
      <span class="sep">›</span><b>Sourcing</b>
    </div>
    <div class="page-head">
      <h1>Funil de Talentos</h1>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="btn-novo">+ Novo Candidato</button>
      <button class="btn btn-secondary" id="btn-nova-busca">Nova Busca</button>
      <button class="btn btn-secondary" id="btn-salvar-busca">Salvar Busca</button>
    </div>

    <div class="pill-tabs" role="tablist">
      <a class="pill-tab active" role="tab" href="busca-nova.html">Busca</a>
      <a class="pill-tab" role="tab" href="../_em-construcao.html?titulo=Favoritos">Favoritos</a>
      <a class="pill-tab" role="tab" href="../_em-construcao.html?titulo=Listas">Listas</a>
      <a class="pill-tab" role="tab" href="../_em-construcao.html?titulo=Buscas Salvas">Buscas Salvas</a>
      <a class="pill-tab" role="tab" href="busca-nova.html?estado=historico">Histórico</a>
    </div>

    <div id="barra-busca"></div>

    <div id="controles"></div>
    <div id="sel-bar"></div>

    <div class="table-wrap" id="tabela"></div>
  </div>

  <div id="camadas"></div>
  <div class="toast-box" id="toasts"></div>

  <script src="../../screens.js"></script>
  <script src="../../scripts/shell.js"></script>
  <script src="../../scripts/conversas.js"></script>
  <script src="../../scripts/mock.js"></script>
  <script src="../../scripts/proto.js"></script>
  <script src="../../scripts/lia.js"></script>
  <script src="../../scripts/busca.js"></script>
  <script>
  /* ---------- ícones (lucide inline, padrão do shell.js) ---------- */
  const I = (p, s) => `<svg width="${s || 16}" height="${s || 16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const ic = {
    back: (s) => I('<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>', s),
    search: (s) => I('<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>', s),
    brief: (s) => I('<path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/>', s),
    pin: (s) => I('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>', s),
    clock: (s) => I('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', s),
    build: (s) => I('<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M2 22h20"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/>', s),
    code: (s) => I('<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>', s),
    doc: (s) => I('<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v5h5"/>', s),
    sliders: (s) => I('<line x1="4" x2="20" y1="7" y2="7"/><line x1="4" x2="20" y1="13" y2="13"/><line x1="4" x2="20" y1="19" y2="19"/><circle cx="9" cy="7" r="2.4" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="2.4" fill="currentColor" stroke="none"/><circle cx="8" cy="19" r="2.4" fill="currentColor" stroke="none"/>', s),
    chevD: (s) => I('<path d="m6 9 6 6 6-6"/>', s),
    x: (s) => I('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>', s),
    check: (s) => I('<polyline points="20 6 9 17 4 12"/>', s),
    plus: (s) => I('<path d="M5 12h14"/><path d="M12 5v14"/>', s),
    globe: (s) => I('<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>', s),
    db: (s) => I('<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/>', s),
    book: (s) => I('<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/>', s),
    arrow: (s) => I('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>', s),
    coin: (s) => I('<circle cx="12" cy="12" r="10"/><path d="M12 6v12"/><path d="M9.5 9.5h5"/><path d="M9.5 14.5h5"/>', s),
    eye: (s) => I('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>', s),
    alert: (s) => I('<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>', s),
    alvo: (s) => I('<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>', s),
    colunas: (s) => I('<polyline points="8 7 3 12 8 17"/><polyline points="16 7 21 12 16 17"/>', s),
    ordenar: (s) => I('<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>', s),
    lista: (s) => I('<line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>', s),
    mail: (s) => I('<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-10 6L2 7"/>', s),
    prancheta: (s) => I('<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>', s),
    estrela: (s) => I('<path d="M11.5 3.2a.6.6 0 0 1 1 0l2.2 4.5 5 .7a.6.6 0 0 1 .3 1l-3.6 3.5.9 5a.6.6 0 0 1-.9.6L12 16.1l-4.4 2.4a.6.6 0 0 1-.9-.6l.9-5-3.6-3.5a.6.6 0 0 1 .3-1l5-.7Z"/>', s),
    olhoCortado: (s) => I('<path d="M10.7 5.1A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-2.2 3.1"/><path d="M6.6 6.6A15.3 15.3 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>', s),
    nuvem: (s) => I('<path d="M12 13v8l-4-4"/><path d="m12 21 4-4"/><path d="M4.4 15.5A5 5 0 0 1 7 6a7 7 0 0 1 13.3 2.2A4.5 4.5 0 0 1 19.5 17"/>', s),
    mais: (s) => I('<circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/><circle cx="5" cy="12" r="1.6"/>', s),
    alerta: (s) => I('<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>', s),
    users: (s) => I('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>', s),
  };

  /* ---------- LIA contextual da tela ---------- */
  Lia.mount({ roteiro: [
    { de: "user", texto: "Achei bons perfis nessa busca, mas preciso de mais gente com CPA-20. Consegue ampliar sem repetir quem já vi?" },
    { de: "lia", texto: "Consigo ✦ Vou continuar a mesma busca a partir do ponto em que paramos, então os 5 que você já salvou na vaga não entram de novo e você não paga por eles outra vez.", digitando: 1600 },
    { de: "lia", texto: "Encontrei mais 340 perfis compatíveis na base global. Quer que eu traga os próximos 10, priorizando quem tem CPA-20 e experiência em FP&A?", digitando: 1200 },
    { de: "user", texto: "Pode trazer" },
    { de: "lia", texto: "Prontinho. Adicionei 10 perfis novos ao final da lista e deixei sua seleção intacta.", digitando: 1400 },
  ]});

  /* ---------- dados ---------- */
  const m = Mock.seed(23);
  const CARGOS_LINHA = [
    "FP&A | Financial Planning | Corporate Finance | Financial Modeling | BI",
    "Finance Executive | FP&A | Financial Manager | Valuation | Securities Analyst",
    "Equity Research Analyst | Renda Variável | Buy Side",
    "CPA-20 | BackOffice | Analista de Cadastro | Onboarding | Fundos",
    "FP&A Manager | Corporate Finance | Financial Analysis | Valuation",
    "Controller | Planejamento Financeiro | Orçamento | Power BI",
    "Analista de Investimentos | CPA-20 | Asset Management",
    "Business Partner Financeiro | Budget | Forecast | SAP",
    "Tesouraria | Fluxo de Caixa | Hedge | Derivativos",
    "Consultor Financeiro | CPA-20 | Private Banking",
    "Analista de Crédito Sênior | Risco | Basileia",
    "Planejamento Financeiro | M&A | Due Diligence | Excel avançado",
  ];
  function gerar(n, offset) {
    const lista = Array.from({ length: n }, (_, i) => {
      const c = m.candidato();
      return {
        id: "c" + (offset + i),
        nome: c.nome, iniciais: c.iniciais,
        cargo: CARGOS_LINHA[(offset + i) % CARGOS_LINHA.length],
        score: 68 + (c.score % 30), // busca de sourcing devolve match alto (ordenado por relevância)
        fonte: (offset + i) % 3 === 1 ? "local" : "global",
      };
    });
    // a busca chega ordenada por relevância (match desc), como no produto
    return lista.sort((a, b) => b.score - a.score);
  }

  const TEXTO_BUSCA = `Sobre a vaga: procuramos Analista Financeiro Sênior para atuar no time de planejamento financeiro em São Paulo, modelo híbrido, 3 dias no escritório.

Responsabilidades:
• Atender às demandas de FP&A, construindo e mantendo o modelo de projeção de resultados da companhia;
• Elaborar o orçamento anual e as revisões trimestrais junto às áreas de negócio;
• Apoiar o fechamento mensal, analisando desvios de orçado x realizado e propondo planos de ação;
• Construir relatórios gerenciais e apresentações para o board e para o conselho;
• Dar suporte a estudos de viabilidade, valuation e projetos de M&A.

Requisitos:
• Superior completo em Administração, Economia, Engenharia ou Contabilidade;
• 5+ anos de experiência no mercado financeiro;
• Domínio de Excel avançado, Power BI e SQL;
• Certificação CPA-20 será considerada diferencial;
• Inglês avançado para interação com investidores.`;

  const CRITERIOS = [
    { k: "cargo", cls: "chip-cargo", ico: "brief", label: "Cargo", valor: "Analista Financeiro Sênior" },
    { k: "local", cls: "chip-local", ico: "pin", label: "Localização", valor: "São Paulo" },
    { k: "exp", cls: "chip-exp", ico: "clock", label: "Experiência", valor: "5+ anos" },
    { k: "setor", cls: "chip-setor", ico: "build", label: "Setor", valor: "Mercado financeiro" },
    { k: "s1", cls: "chip-skill", ico: "code", label: "Habilidades", valor: "Excel avançado" },
    { k: "s2", cls: "chip-skill", ico: "code", label: "Habilidades", valor: "Power BI" },
    { k: "s3", cls: "chip-skill", ico: "code", label: "Habilidades", valor: "SQL" },
    { k: "s4", cls: "chip-skill", ico: "code", label: "Habilidades", valor: "CPA-20" },
    { k: "s5", cls: "chip-skill", ico: "code", label: "Habilidades", valor: "Inglês avançado" },
  ];
  const CHIPS_VISIVEIS = 4;

  /* ---------- estado da tela ---------- */
  const S = {
    linhas: [],
    sel: new Set(),
    salvos: new Set(),
    criterios: CRITERIOS.slice(),
    omitidos: 0,
    mostrarOmitidos: false,
    total: 340,
    filtros: 4,
    daVaga: true,
    vaga: "Analista Financeiro Sênior",
  };

  const $ = (s) => document.querySelector(s);
  const camadas = () => document.getElementById("camadas");

  function toast(msg) {
    const box = document.getElementById("toasts");
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 3600);
  }

  /* ---------- controles da tabela (Selecionar Todos / Filtros / Colunas) ---------- */
  function controlesHTML() {
    return `
      <button class="btn btn-sm btn-secondary" id="btn-select-all">${ic.check(13)} Selecionar Todos</button>
      <button class="btn btn-sm btn-secondary ${S.filtros ? "com-filtros" : ""}" id="btn-filtros">${ic.alvo(13)} Filtros${S.filtros ? ` <span class="badge badge-gray">${S.filtros}</span>` : ""}</button>
      <button class="btn btn-sm btn-secondary" id="btn-colunas">${ic.colunas(13)} Colunas <span class="badge badge-gray">13</span></button>`;
  }
  function ligarControles() {
    const sa = document.getElementById("btn-select-all");
    if (sa) sa.addEventListener("click", () => {
      if (S.sel.size === S.linhas.length) S.sel.clear();
      else S.linhas.forEach((c) => S.sel.add(c.id));
      renderBarra(); renderTabela(); renderBulk();
    });
    const f = document.getElementById("btn-filtros");
    if (f) f.addEventListener("click", () => abrirFiltrosAvancados());
    const cl = document.getElementById("btn-colunas");
    if (cl) cl.addEventListener("click", () => toast("Abre o painel de colunas (13 colunas disponíveis)."));
  }

  /* ---------- barra da busca ---------- */
  function barraProposta() {
    const vis = S.criterios.slice(0, CHIPS_VISIVEIS);
    const resto = S.criterios.length - vis.length;
    const chips = vis.map((c) => `
      <span class="chip-tax ${c.cls}" data-crit="${c.k}" title="${c.label}: ${c.valor}">
        ${ic[c.ico](12)}${c.valor}
        <button class="chip-tax rm" data-rm="${c.k}" aria-label="Remover ${c.label}" style="padding:0;background:none">${ic.x(11)}</button>
      </span>`).join("");
    return `
      <div class="query-bar">
        <button class="icon-btn" id="btn-voltar" aria-label="Voltar para a busca">${ic.back(18)}</button>
        <span class="qb-ico">${ic.search(16)}</span>
        <button class="chip-tax chip-modo" id="btn-modo" title="Ver o texto usado nesta busca">${ic.doc(12)} Descrição da vaga</button>
        <span class="qb-sep"></span>
        <div class="qb-chips">${chips}</div>
        ${resto > 0 ? `<button class="chip-tax chip-mais" id="btn-mais-crit">+${resto} ${ic.chevD(11)}</button>` : ""}
        <span class="qb-sep"></span>
        <button class="btn btn-sm btn-secondary" id="btn-editar">${ic.sliders(13)} Editar busca${S.filtros ? ` <span class="badge badge-gray">${S.filtros}</span>` : ""}</button>
      </div>`;
  }

  function renderBarra() {
    document.getElementById("barra-busca").innerHTML = barraProposta();
    // os controles da tabela ganham uma linha só deles, porque a barra da
    // busca passa a carregar a taxonomia.
    document.getElementById("controles").innerHTML = `
      <div class="controls-row">
        <span class="res-count" id="res-count"></span>
        <div class="spacer"></div>
        ${controlesHTML()}
      </div>`;
    ligarControles();
    const chipModo = document.getElementById("btn-modo");
    if (chipModo) chipModo.addEventListener("click", abrirTexto);
    const voltarBusca = document.getElementById("btn-voltar");
    if (voltarBusca) voltarBusca.addEventListener("click", () => { location.href = "busca-nova.html"; });
    $("#btn-editar").addEventListener("click", () => abrirEditar("natural"));
    const mais = $("#btn-mais-crit");
    if (mais) mais.addEventListener("click", () => abrirEditar("natural"));
    document.querySelectorAll("[data-crit]").forEach((el) =>
      el.addEventListener("click", () => abrirEditar("natural")));
    document.querySelectorAll("[data-rm]").forEach((el) =>
      el.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const k = el.dataset.rm;
        const c = S.criterios.find((x) => x.k === k);
        S.criterios = S.criterios.filter((x) => x.k !== k);
        renderBarra();
        toast(`Critério <b>${c.valor}</b> removido. Clique em Editar busca para refazer a busca.`);
      }));
  }

  /* ---------- tabela ---------- */
  function linhaHTML(c) {
    const on = S.sel.has(c.id);
    const salvo = S.salvos.has(c.id);
    const ring = c.score >= 80 ? "" : c.score >= 65 ? " media" : " baixa";
    return `<tr class="${salvo ? "row-salvo" : ""}" data-id="${c.id}">
      <td class="c-check"><button class="check ${on ? "on" : ""}" data-check="${c.id}" role="checkbox" aria-checked="${on}" aria-label="Selecionar ${c.nome}">${ic.check(12)}</button></td>
      <td class="c-match"><span class="match-ring${ring}">${c.score}</span></td>
      <td class="c-fonte"><span class="fonte-ico" title="${c.fonte === "global" ? "Busca global" : "Banco de talentos"}">${c.fonte === "global" ? ic.globe(17) : ic.db(17)}</span></td>
      <td>
        <div class="nome-cell">
          <span class="avatar">${c.iniciais}</span>
          <span class="nm">${c.nome}</span>
          ${salvo ? `<span class="badge badge-cyan">${ic.check(11)} Na vaga</span>` : ""}
        </div>
      </td>
      <td class="c-cargo">${c.cargo}</td>
    </tr>`;
  }

  function renderTabela(opts) {
    opts = opts || {};
    const aviso = S.omitidos && !S.mostrarOmitidos
      ? `<div class="hint-row">${ic.eye(15)} <span><b>${S.omitidos} perfis</b> que você já viu nesta vaga foram omitidos para não gastar créditos de novo.</span>
           <button class="link" id="btn-mostrar-omitidos">Mostrar mesmo assim</button></div>` : "";
    const rodape = opts.semRodape ? "" : `
      <div class="load-more">
        <button class="btn btn-sm btn-secondary" id="btn-mais">${ic.plus(13)} Buscar mais candidatos</button>
        <span class="meta" id="meta-mais">${S.linhas.length} de ~${S.total} encontrados${S.salvos.size ? ` · ${S.salvos.size} já na vaga` : ""}</span>
      </div>`;
    document.getElementById("tabela").innerHTML = `
      ${aviso}
      <table class="tbl">
        <thead><tr>
          <th class="c-check"><button class="check ${S.sel.size && S.sel.size === S.linhas.length ? "on" : S.sel.size ? "parcial" : ""}" aria-label="Selecionar todos"></button></th>
          <th class="c-match">Match ${ic.ordenar(12)}</th>
          <th class="c-fonte">Fonte ${ic.ordenar(12)}</th>
          <th>Candidato ${ic.ordenar(12)}</th>
          <th>Cargo atual ${ic.ordenar(12)}</th>
        </tr></thead>
        <tbody>${S.linhas.map(linhaHTML).join("")}</tbody>
      </table>
      ${rodape}`;
    const rc = document.getElementById("res-count");
    if (rc) rc.textContent = `${S.linhas.length} candidato${S.linhas.length === 1 ? "" : "s"} nesta busca`;

    document.querySelectorAll("[data-check]").forEach((b) =>
      b.addEventListener("click", () => {
        const id = b.dataset.check;
        S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
        renderBarra(); renderTabela(opts); renderBulk();
      }));
    const mostrar = document.getElementById("btn-mostrar-omitidos");
    if (mostrar) mostrar.addEventListener("click", () => {
      S.mostrarOmitidos = true;
      S.linhas = S.linhas.concat(gerar(S.omitidos, 900));
      S.omitidos = 0;
      renderTabela(opts);
      toast("Perfis já vistos voltaram para a lista. Eles não geram cobrança nova.");
    });
    const mais = document.getElementById("btn-mais");
    if (mais) mais.addEventListener("click", buscarMais);
  }

  function buscarMais() {
    const btn = document.getElementById("btn-mais");
    btn.disabled = true;
    btn.innerHTML = "Buscando mais candidatos…";
    setTimeout(() => {
      S.linhas = S.linhas.concat(gerar(6, S.linhas.length + 100));
      renderTabela();
      toast("6 novos perfis adicionados. Sua seleção foi mantida.");
    }, 900);
  }

  /* ---------- barra de ações em lote (posição do produto) ---------- */
  function renderBulk() {
    const box = document.getElementById("sel-bar");
    Busca.fecharMenus();
    if (!S.sel.size) { box.innerHTML = ""; return; }
    const n = S.sel.size;
    box.innerHTML = Busca.selBarHTML({ n: n, total: S.linhas.length, daVaga: S.daVaga });

    const liga = (acao, fn) => {
      const el = box.querySelector(`[data-sel="${acao}"]`);
      if (el) el.addEventListener("click", fn);
    };
    liga("salvar", () => salvarEContinuar());
    liga("escolher", () => toast("Abre o seletor de vagas (busca fora do contexto de uma vaga)."));
    liga("lista", () => toast("Abre a escolha da lista de destino."));
    liga("mensagem", () => toast("Abre o envio de mensagem em massa."));
    liga("wsi", () => toast("Dispara a triagem WSI para os selecionados."));
    liga("limpar", () => { S.sel.clear(); renderBarra(); renderTabela(); renderBulk(); });
    liga("variacoes", (ev) => {
      ev.stopPropagation();
      Busca.abrirMenu(box.querySelector('[data-sel="variacoes"]'), Busca.menuVariacoes(n), (acao) => {
        if (acao === "voltar") {
          salvarEContinuar(true);
          toast(`Abrindo a vaga <b>${S.vaga}</b> com ${n} candidatos em processamento…`);
          setTimeout(() => { location.href = "../vagas/vaga-kanban.html?estado=importando"; }, 900);
        } else salvarEContinuar();
      }, camadas());
    });
    liga("mais", (ev) => {
      ev.stopPropagation();
      Busca.abrirMenu(box.querySelector('[data-sel="mais"]'), Busca.menuMais(n),
        () => toast("Ação que já existe no produto, mantida no menu para não lotar a barra."), camadas());
    });
  }

  function salvarEContinuar(silencioso) {
    const n = S.sel.size;
    S.sel.forEach((id) => S.salvos.add(id));
    S.sel.clear();
    renderBarra(); renderTabela(); renderBulk();
    if (!silencioso) toast(`<b>${n} candidatos salvos na vaga</b><br>${S.vaga} · você continua na busca`);
  }

  /* ---------- popover do texto original ---------- */
  function abrirTexto(ev) {
    fecharCamadas();
    const alvo = (ev && ev.currentTarget) || document.getElementById("btn-modo");
    const anchor = alvo.getBoundingClientRect();
    const el = document.createElement("div");
    el.className = "popover";
    el.style.top = (anchor.bottom + window.scrollY + 8) + "px";
    el.style.left = Math.min(Math.max(24, anchor.left + window.scrollX - 20), window.innerWidth - 640) + "px";
    el.style.position = "absolute";
    el.innerHTML = `
      <h4>Texto usado na busca</h4>
      <div class="pv-txt">${TEXTO_BUSCA}</div>
      <div class="pv-foot">
        <span>${TEXTO_BUSCA.length} caracteres · ${CRITERIOS.length} critérios reconhecidos pela LIA</span>
        <button class="btn btn-sm btn-secondary" id="pv-editar">${ic.sliders(13)} Editar busca</button>
      </div>`;
    camadas().appendChild(el);
    document.getElementById("pv-editar").addEventListener("click", () => abrirEditar("jd"));
    setTimeout(() => document.addEventListener("click", fecharAoClicarFora), 0);
  }
  function fecharAoClicarFora(ev) {
    if (ev.target.closest(".popover") || ev.target.closest("#btn-modo")) return;
    fecharCamadas();
  }

  /* ---------- modal "Editar sua busca" (EditQueryModal do produto) ----------
     Proposta desta rodada: os Filtros avançados deixam de abrir um painel
     separado e passam a ser uma seção deste mesmo modal, que já é a porta
     única de edição da busca.                                              */
  const QUALIDADE = {
    score: 60,
    proxima: "Adicione experiência para melhorar os resultados",
    alertas: [
      { tipo: "aviso", msg: "Sua busca pode ser muito ampla. Considere adicionar experiência e habilidades para refinar os resultados." },
      { tipo: "info", msg: "Considere também: analista de FP&A, controller, business partner financeiro", acao: "Adicionar sinônimos de 'analista financeiro'" },
    ],
  };
  const SUGESTAO_LIA = "Analista financeiro sênior em São Paulo com CPA-20 e experiência em FP&A no mercado financeiro";

  function corpoEditar(modo) {
    return Busca.caixa({
      modo: modo || "natural", modos: Busca.MODOS, tags: "preenchido", fonte: "hibrida",
      texto: modo === "jd" ? Busca.TEXTO_JD : TEXTO_CURTO, altura: modo === "jd" ? 180 : 56,
      sugestoes: false, sugestaoLia: modo === "natural" ? SUGESTAO_LIA : null, qualidade: QUALIDADE,
    });
  }

  const TEXTO_CURTO = "Analista financeiro sênior em São Paulo, 5+ anos no mercado financeiro, CPA-20";

  function abrirFiltrosAvancados() {
    Busca.abrirFiltros(camadas(), { fonte: "hibrida" }, (n) => {
      S.filtros = n;                 // o contador vive na tela: barra e controles
      renderBarra();
      toast(`Filtros aplicados: ${n} ativo${n === 1 ? "" : "s"}. A busca será refeita com eles.`);
    });
  }

  function abrirEditar(modo) {
    fecharCamadas();
    camadas().innerHTML = Busca.modalEditarHTML({ corpo: corpoEditar(modo || "natural") });
    ligarEditar(modo || "natural");
  }

  function ligarEditar(modoAtual) {
    const raiz = camadas();
    raiz.querySelector("[data-eq-scrim]").addEventListener("click", (ev) => {
      if (ev.target === ev.currentTarget) fecharCamadas();
    });
    raiz.querySelector('[data-eq="cancelar"]').addEventListener("click", fecharCamadas);
    raiz.querySelector('[data-eq="salvar"]').addEventListener("click", () => {
      fecharCamadas();
      toast("Busca refeita com os critérios ajustados. Sua seleção foi mantida.");
    });
    raiz.querySelectorAll("[data-modo]").forEach((b) =>
      b.addEventListener("click", () => {
        raiz.querySelector("#eq-body").innerHTML = corpoEditar(b.dataset.modo);
        ligarCorpo(b.dataset.modo);
      }));
    ligarCorpo(modoAtual);
  }

  function ligarCorpo(modo) {
    const raiz = camadas();
    raiz.querySelectorAll("[data-modo]").forEach((b) =>
      b.addEventListener("click", () => {
        raiz.querySelector("#eq-body").innerHTML = corpoEditar(b.dataset.modo);
        ligarCorpo(b.dataset.modo);
      }));
    const filtros = raiz.querySelector("[data-filtros]");
    if (filtros) filtros.addEventListener("click", () => abrirFiltrosAvancados());
    const aceitar = raiz.querySelector("[data-aceitar]");
    if (aceitar) aceitar.addEventListener("click", () => {
      const ta = raiz.querySelector(".sc-field textarea");
      if (ta) ta.value = SUGESTAO_LIA;
      raiz.querySelector(".lia-sug").remove();
      toast("Sugestão da LIA aplicada ao texto da busca.");
    });
    const dispensar = raiz.querySelector("[data-dispensar]");
    if (dispensar) dispensar.addEventListener("click", () => raiz.querySelector(".lia-sug").remove());
    raiz.querySelectorAll("[data-fonte]").forEach((b) =>
      b.addEventListener("click", () => {
        raiz.querySelectorAll("[data-fonte]").forEach((x) => x.classList.remove("on-local", "on-hibrida", "on-global"));
        b.classList.add("on-" + b.dataset.fonte);
      }));
    raiz.querySelectorAll("[data-contato]").forEach((b) =>
      b.addEventListener("click", () => b.classList.toggle("on-contato")));
    const assist = raiz.querySelector("[data-assistente]");
    if (assist) assist.addEventListener("click", () => assist.classList.toggle("off"));
  }

  function fecharCamadas() {
    Busca.fecharMenus();
    camadas().innerHTML = "";
    document.removeEventListener("click", fecharAoClicarFora);
  }

  /* ---------- ações do cabeçalho ---------- */
  document.getElementById("btn-nova-busca").addEventListener("click", () => { location.href = "busca-nova.html"; });
  document.getElementById("btn-salvar-busca").addEventListener("click", () => toast("Busca salva em <b>Buscas Salvas</b>."));
  document.getElementById("btn-novo").addEventListener("click", () => toast("Abre o cadastro manual de candidato."));

  /* ---------- estados ---------- */
  function base(n) {
    S.criterios = CRITERIOS.slice();
    S.sel = new Set(); S.salvos = new Set();
    S.omitidos = 0; S.mostrarOmitidos = false; S.daVaga = true; S.filtros = 4;
    S.linhas = gerar(n, 0);
    fecharCamadas();
  }
  function pintar(opts) { renderBarra(); renderTabela(opts); renderBulk(); }

  Proto.states([
    { id: "padrao", label: "Padrão (taxonomia)", render: () => { base(10); pintar(); } },
    { id: "selecao", label: "5 selecionados", render: () => {
        base(10); S.linhas.slice(0, 5).forEach((c) => S.sel.add(c.id)); pintar(); } },
    { id: "salvos", label: "Depois de salvar", render: () => {
        base(10); S.linhas.slice(0, 5).forEach((c) => S.salvos.add(c.id)); pintar();
        toast("<b>5 candidatos salvos na vaga</b><br>Analista Financeiro Sênior · você continua na busca"); } },
    { id: "ja-vistos", label: "Já vistos omitidos", render: () => {
        base(10); S.omitidos = 12; S.linhas.slice(0, 3).forEach((c) => S.salvos.add(c.id)); pintar(); } },
    { id: "muitos", label: "Muitos + carregar mais", render: () => { base(40); pintar(); } },
    { id: "vazio", label: "0 registros", render: () => {
        base(0); renderBarra(); renderBulk();
        const rc0 = document.getElementById("res-count"); if (rc0) rc0.textContent = "Nenhum candidato";
        document.getElementById("tabela").innerHTML = `
          <div class="empty-state">
            <div class="ico">⌕</div>
            <h3>Nenhum candidato encontrado para estes critérios</h3>
            <p>Remova algum critério da busca ou amplie a fonte para incluir a base global.</p>
            <button class="btn btn-secondary" style="margin-right:8px" onclick="document.getElementById('btn-editar').click()">Editar busca</button>
            <button class="btn btn-ai">✦ Pedir sugestão para a LIA</button>
          </div>`; } },
    { id: "carregando", label: "Carregando", render: () => {
        base(0); renderBarra(); renderBulk();
        const rc1 = document.getElementById("res-count"); if (rc1) rc1.textContent = "Buscando candidatos…";
        document.getElementById("tabela").innerHTML =
          `<div style="padding:var(--space-4);display:flex;flex-direction:column;gap:10px">` +
          Array(8).fill('<div class="skeleton skeleton-row"></div>').join("") + `</div>`; } },
    { id: "erro", label: "Erro", render: () => {
        base(0); renderBarra(); renderBulk();
        const rc2 = document.getElementById("res-count"); if (rc2) rc2.textContent = "";
        document.getElementById("tabela").innerHTML = `
          <div style="padding:var(--space-5)">
            <div class="error-banner">⚠ Não foi possível concluir a busca global agora. Nenhum crédito foi consumido.
              <span style="flex:1"></span><button class="btn btn-sm btn-secondary">Tentar de novo</button></div>
          </div>`; } },
  ]);
  </script>
</body>
</html>
