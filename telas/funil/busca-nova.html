<!DOCTYPE html>
<!-- =========================================================
  Funil de Talentos > Busca (estado inicial)
  Réplica do produto: CandidateSearchBar (LiaPromptHeader +
  SmartSearchInput) com TabsScrollRow, SSIModeNatural e
  SearchSourceToolbar. Medidas e textos vindos do ai-ui.
========================================================= -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Funil de Talentos: busca — Protótipo WeDOTalent</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/base.css">
  <style>
    .arq-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-top: var(--space-3); }
    .arq { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: var(--space-4); background: var(--bg-primary); cursor: pointer; }
    .arq:hover { border-color: var(--border-default); box-shadow: var(--shadow-sm); }
    .arq .t { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .arq .d { font-size: var(--text-xs); color: var(--text-tertiary); margin-top: 4px; }
    .arq .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: var(--space-3); }
    .url-list { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-3); }
  </style>
</head>
<body>
  <div id="shell" data-nav="Funil de Talentos"></div>

  <div id="tela">
    <div class="crumbs" style="margin-bottom:var(--space-3)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <a href="../_em-construcao.html?titulo=Início">Início</a>
      <span class="sep">›</span><b>Funil de Talentos</b>
    </div>

    <div class="page-head">
      <h1>Funil de Talentos</h1>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="btn-novo">+ Novo Candidato</button>
    </div>

    <div class="pill-tabs" role="tablist" id="abas">
      <button class="pill-tab active" role="tab" data-aba="busca">Busca</button>
      <a class="pill-tab" role="tab" href="../_em-construcao.html?titulo=Favoritos">Favoritos</a>
      <a class="pill-tab" role="tab" href="../_em-construcao.html?titulo=Listas">Listas</a>
      <a class="pill-tab" role="tab" href="../_em-construcao.html?titulo=Buscas Salvas">Buscas Salvas</a>
      <button class="pill-tab" role="tab" data-aba="historico">Histórico</button>
    </div>

    <div class="busca-centro" id="area">
      <div class="interno" id="centro"></div>
    </div>
  </div>

  <div class="toast-box" id="toasts"></div>

  <script src="../../screens.js"></script>
  <script src="../../scripts/shell.js"></script>
  <script src="../../scripts/conversas.js"></script>
  <script src="../../scripts/mock.js"></script>
  <script src="../../scripts/proto.js"></script>
  <script src="../../scripts/lia.js"></script>
  <script src="../../scripts/busca.js"></script>
  <script>
  const ic = Busca.ic;

  Lia.mount({ roteiro: [
    { de: "user", texto: "Preciso de um analista financeiro sênior em São Paulo, com CPA-20 e vivência em FP&A" },
    { de: "lia", texto: "Entendi ✦ Já separei os critérios: cargo Analista Financeiro Sênior, São Paulo, 5+ anos, mercado financeiro e as habilidades Excel avançado, Power BI, SQL e CPA-20.", digitando: 1500 },
    { de: "lia", texto: "Na base global isso deve trazer cerca de 340 perfis. Quer que eu comece pelos 10 mais aderentes para você avaliar antes de gastar mais créditos?", digitando: 1200 },
    { de: "user", texto: "Isso, começa com 10" },
  ]});

  function toast(msg) {
    const box = document.getElementById("toasts");
    const t = document.createElement("div");
    t.className = "toast"; t.innerHTML = msg;
    box.appendChild(t); setTimeout(() => t.remove(), 3600);
  }

  /* Buscas anteriores: caminho navegável até a tela com candidatos, sem
     transformar os resultados na porta de entrada do Funil de Talentos. */
  const HISTORICO = [
    { id: 1387, titulo: "Analista Financeiro Sênior · São Paulo · CPA-20", fonte: "Híbrida", qtd: 10, quando: "há 2 horas", chips: Busca.CRITERIOS.slice(0, 4) },
    { id: 1381, titulo: "Professora de matemática para o ensino médio", fonte: "Banco", qtd: 24, quando: "ontem", chips: [] },
    { id: 1374, titulo: "Desenvolvedora backend sênior remota, Node.js e Python", fonte: "Global", qtd: 18, quando: "3 dias atrás", chips: [] },
  ];

  /* Atalho para retomar a ultima busca: fica logo abaixo do campo, no caminho
     do olho de quem chega ao Funil, sem competir com a busca nova. Retomar abre
     o sourcing ja executado, entao nao refaz busca nem cobra credito de novo. */
  function faixaRetomarHTML(busca) {
    if (!busca) return "";
    return `
      <button class="retomar" data-retomar="${busca.id}" type="button">
        ${ic.ciclo(14)}
        <span class="txt">Retomar: <b>${busca.titulo}</b></span>
        <span class="meta">${busca.qtd} candidatos · ${busca.quando}</span>
      </button>`;
  }

  const TITULO_PADRAO = "Vamos buscar de forma inteligente?";
  function header(titulo) {
    return `<div class="lia-prompt">${ic.brain(28)} ${titulo || TITULO_PADRAO}</div>`;
  }

  function montar(html) {
    marcarAba("busca");
    document.getElementById("area").classList.remove("sem-recuo");
    document.getElementById("centro").innerHTML = html;
    ligar();
  }

  function marcarAba(id) {
    document.querySelectorAll("#abas [data-aba]").forEach((b) =>
      b.classList.toggle("active", b.dataset.aba === id));
    document.querySelectorAll("#abas a").forEach((a) => a.classList.remove("active"));
  }

  function historicoHTML() {
    return `
      <div class="hist-lista">
        ${HISTORICO.map((h) => `
          <a class="hist-item" href="sourcing-resultados.html">
            <span class="hist-ico">${ic.search(16)}</span>
            <span class="hist-txt">
              <span class="t">${h.titulo}</span>
              <span class="m">Busca #${h.id} · ${h.fonte} · ${h.qtd} candidatos · ${h.quando}</span>
              ${h.chips.length ? `<span class="c">${h.chips.map((c) => `<span class="chip-tax ${c.cls}">${ic[c.ico](11)} ${c.valor}</span>`).join("")}</span>` : ""}
            </span>
            <span class="hist-abrir">Abrir resultados ${ic.arrow(14)}</span>
          </a>`).join("")}
      </div>`;
  }

  function ligar() {
    document.querySelectorAll("[data-modo]").forEach((b) =>
      b.addEventListener("click", () => Proto.apply(b.dataset.modo)));
    document.querySelectorAll("[data-fonte]").forEach((b) =>
      b.addEventListener("click", () => {
        const f = b.dataset.fonte;
        document.querySelectorAll("[data-fonte]").forEach((x) => {
          x.classList.remove("on-local", "on-hibrida", "on-global");
        });
        b.classList.add("on-" + f);
        toast(f === "local"
          ? "Seu banco de talentos: gratuito e local."
          : f === "hibrida"
            ? "Busca híbrida: consome créditos só na parcela global."
            : "Busca global: mais de 800M de perfis, consome créditos.");
      }));
    document.querySelectorAll("[data-contato]").forEach((b) =>
      b.addEventListener("click", () => b.classList.toggle("on-contato")));
    const assist = document.querySelector("[data-assistente]");
    if (assist) assist.addEventListener("click", () => assist.classList.toggle("off"));
    document.querySelectorAll("[data-buscar]").forEach((b) =>
      b.addEventListener("click", () => {
        Proto.apply("buscando");
        setTimeout(() => { location.href = "sourcing-resultados.html"; }, 1400);
      }));
    // Retomar abre o sourcing que ja rodou: nao passa pelo estado "buscando",
    // porque nao ha busca nova nem credito a gastar.
    const retomar = document.querySelector("[data-retomar]");
    if (retomar) retomar.addEventListener("click", () => {
      location.href = "sourcing-resultados.html";
    });
    document.querySelectorAll(".sug-chip").forEach((b) =>
      b.addEventListener("click", () => {
        const ta = document.querySelector(".sc-field textarea");
        if (ta) { ta.value = b.textContent.trim(); ta.focus(); }
        document.querySelector(".sc-submit")?.classList.add("ativo");
      }));
    const filtros = document.querySelector("[data-filtros]");
    if (filtros) filtros.addEventListener("click", () =>
      Busca.abrirFiltros(document.body, { fonte: "hibrida" }, (n) => {
        const b = document.querySelector("[data-filtros]");
        if (b) b.classList.toggle("on-filtros", n > 0);
        toast(`Filtros aplicados: ${n} ativo${n === 1 ? "" : "s"}.`);
      }));
    // atalho do produto: volta para os resultados da busca em andamento
    const atalho = document.querySelector(".sc-gotoresults");
    if (atalho) {
      atalho.setAttribute("title", "Ver os resultados da última busca");
      atalho.addEventListener("click", () => { location.href = "sourcing-resultados.html"; });
    }
  }

  document.querySelectorAll("#abas [data-aba]").forEach((b) =>
    b.addEventListener("click", () => Proto.apply(b.dataset.aba === "historico" ? "historico" : "natural")));

  Proto.states([
    { id: "natural", label: "Estado inicial", render: () =>
        montar(header() + Busca.caixa({ modo: "natural", tags: "vazio", fonte: "hibrida" })
               + faixaRetomarHTML(HISTORICO[0])) },

    { id: "sem-historico", label: "Primeira busca da conta", render: () =>
        montar(header() + Busca.caixa({ modo: "natural", tags: "vazio", fonte: "hibrida" })
               + faixaRetomarHTML(null)) },

    { id: "historico", label: "Histórico de buscas", render: () => {
        marcarAba("historico");
        document.getElementById("area").classList.add("sem-recuo");
        document.getElementById("centro").innerHTML = `
          <div class="hist-cab">
            <h2>Buscas anteriores</h2>
            <p>Abra uma busca para ver os candidatos que ela trouxe, continuar de onde parou ou refazer com outros critérios.</p>
          </div>` + historicoHTML();
      } },

    { id: "digitado", label: "Com texto e critérios", render: () =>
        montar(header() + Busca.caixa({
          modo: "natural", tags: "preenchido", fonte: "hibrida", preview: true,
          texto: "Analista financeiro sênior em São Paulo, 5+ anos no mercado financeiro, com CPA-20, Excel avançado, Power BI e SQL",
        })) },

    { id: "jd", label: "Descrição da vaga", render: () =>
        montar(header() + Busca.caixa({
          modo: "jd", tags: "preenchido", fonte: "global", preview: true, texto: Busca.TEXTO_JD, altura: 200,
          placeholder: "Cole aqui a descrição completa da vaga",
        }) + `<p class="sc-dica" style="margin-top:10px">O texto colado continua guardado na busca, mas quem identifica a busca na tela de resultados passa a ser a taxonomia acima. O texto fica a um clique em <b>Ver texto original</b>.</p>`) },

    { id: "similar", label: "Perfis similares", render: () =>
        montar(header() + Busca.caixa({
          modo: "similar", tags: "vazio", fonte: "global", semSubmit: true, sugestoes: false,
          placeholder: "Cole o LinkedIn de quem você quer usar como referência",
        }) + `
        <div class="url-list">
          <div class="token-field">${ic.users(13)} linkedin.com/in/analista-financeiro-referencia ${ic.x(12)}</div>
          <div class="token-field">${ic.doc(13)} curriculo-referencia.pdf ${ic.x(12)}</div>
          <button class="btn btn-sm btn-secondary" style="align-self:flex-start">${ic.plus(13)} Adicionar perfil ou currículo</button>
        </div>`) },

    { id: "boolean", label: "Boolean", render: () =>
        montar(header() + Busca.caixa({
          modo: "boolean", tags: "vazio", fonte: "global", sugestoes: false,
          texto: '("analista financeiro" OR "FP&A") AND ("CPA-20" OR "CPA 20") AND ("São Paulo" OR SP) NOT estagiário',
          placeholder: "Escreva a expressão booleana",
        }) + `<p class="sc-dica" style="margin-top:10px">No modo Boolean a LIA não extrai critérios: a busca é identificada pela própria expressão, truncada em uma linha na tela de resultados.</p>`) },

    { id: "arquetipos", label: "Arquétipos", render: () =>
        montar(header() + Busca.caixa({
          modo: "arquetipos", tags: "vazio", fonte: "global", semSubmit: true, sugestoes: false,
          placeholder: "Escolha um arquétipo salvo ou crie um novo a partir de uma contratação de sucesso",
        }) + `
        <div class="arq-grid">
          <div class="arq"><div class="t">🎯 Analista Financeiro Sênior</div>
            <div class="d">Criado a partir da contratação de Juliana Martins</div>
            <div class="tags"><span class="chip">FP&A</span><span class="chip">CPA-20</span><span class="chip">São Paulo</span></div></div>
          <div class="arq"><div class="t">📊 Controller</div>
            <div class="d">Usado em 4 buscas nos últimos 90 dias</div>
            <div class="tags"><span class="chip">Orçamento</span><span class="chip">Power BI</span></div></div>
          <div class="arq"><div class="t">💼 Business Partner</div>
            <div class="d">Arquétipo público da conta</div>
            <div class="tags"><span class="chip">Budget</span><span class="chip">SAP</span></div></div>
        </div>`) },

    { id: "buscando", label: "Buscando", render: () => {
        montar(header("LIA está buscando...") + Busca.caixa({
          modo: "natural", tags: "preenchido", fonte: "hibrida", semSubmit: true, sugestoes: false,
          texto: "Analista financeiro sênior em São Paulo, 5+ anos no mercado financeiro, com CPA-20",
        }));
        document.getElementById("centro").insertAdjacentHTML("beforeend", `
          <div class="fs-overlay" style="position:static;padding:var(--space-6) 0">
            <span class="ring"></span>
            <h4>Procurando candidatos na base global…</h4>
            <p>Buscas na base global podem levar até 1 minuto. Os resultados aparecem aqui assim que estiverem prontos.</p>
            <span class="sc-dica">${ic.coin(12)} 10 créditos reservados para esta busca</span>
          </div>`); } },

    { id: "erro", label: "Erro", render: () => {
        montar(header() + Busca.caixa({
          modo: "natural", tags: "preenchido", fonte: "global", sugestoes: false,
          texto: "Analista financeiro sênior em São Paulo, 5+ anos, CPA-20",
        }));
        document.getElementById("centro").insertAdjacentHTML("beforeend", `
          <div class="error-banner" style="margin-top:var(--space-4)">⚠ A base global não respondeu agora. Nenhum crédito foi consumido.
            <span style="flex:1"></span><button class="btn btn-sm btn-secondary">Tentar de novo</button></div>`); } },
  ]);
  </script>
</body>
</html>
