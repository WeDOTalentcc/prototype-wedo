<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protótipo WeDOTalent — Galeria de Telas</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <style>
    .hero { padding: var(--space-10) 0 var(--space-6); }
    .hero h1 { font-size: var(--text-2xl); letter-spacing: -0.5px; }
    .hero p { color: var(--text-secondary); margin-top: var(--space-2); max-width: 640px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-4); }
    .screen-card { display: block; padding: var(--space-5); transition: box-shadow .15s; }
    .screen-card:hover { box-shadow: var(--shadow-md); }
    .screen-card h3 { font-size: var(--text-lg); margin-bottom: var(--space-1); }
    .screen-card p { font-size: var(--text-sm); color: var(--text-secondary); margin-top: var(--space-2); }
    .area-title { font-size: var(--text-xs); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-tertiary); margin: var(--space-8) 0 var(--space-3); }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 var(--space-6) var(--space-10); }
    .topline { height: 5px; background: linear-gradient(90deg, var(--wedo-cyan) 0 30%, var(--wedo-green) 0 55%, var(--wedo-purple) 0 75%, var(--wedo-magenta) 0 90%, var(--lia-coral) 0 100%); }
  </style>
</head>
<body>
  <div class="topline"></div>
  <div class="wrap">
    <div class="hero">
      <h1>WeDO<span style="color:var(--wedo-cyan-dark)">Talent</span> — Protótipo do Produto</h1>
      <p>Protótipo navegável de alta fidelidade da plataforma LIA. Fonte de referência de design para o time de engenharia.
         Em cada tela, use a <b>barra flutuante</b> (ou as teclas 1–9) para alternar entre os estados: vazio, com dados, paginação, carregando, erro.</p>
    </div>
    <div id="galeria"></div>
  </div>

  <script src="screens.js"></script>
  <script>
    const badge = {
      "rascunho": ["badge-gray", "Rascunho"],
      "em-revisao": ["badge-orange", "Em revisão"],
      "aprovado": ["badge-green", "Aprovado"],
    };
    document.getElementById("galeria").innerHTML = window.SCREENS.map(grp => `
      <div class="area-title">${grp.area}</div>
      <div class="grid">${grp.items.map(s => {
        const [cls, label] = badge[s.status] || badge["rascunho"];
        return `<a class="card screen-card" href="${s.arquivo}">
          <h3>${s.titulo}</h3>
          <span class="badge ${cls}">${label}</span>
          <p>${s.descricao || ""}</p></a>`;
      }).join("")}</div>`).join("");
  </script>
</body>
</html>
